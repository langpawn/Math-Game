<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌐 有向數極速挑戰 Directed Number Quest</title>
    <style>
        :root {
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-card {
            background-color: var(--card);
            border: 2px solid #334155;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .screen { display: none; }
        .active { display: block; }

        h1 { color: #60a5fa; margin-bottom: 10px; }
        
        .hud {
            display: flex;
            justify-content: space-between;
            background: #0f172a;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .timer-bar-container {
            background: #334155;
            height: 6px;
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .timer-bar {
            background: var(--warning);
            height: 100%;
            width: 100%;
            transition: width 0.1s linear;
        }

        .question {
            font-size: 3rem;
            font-weight: bold;
            margin: 20px 0;
            letter-spacing: 1px;
        }

        input[type="text"] {
            background: #0f172a;
            color: white;
            border: 2px solid #475569;
            font-size: 1.8rem;
            padding: 12px;
            width: 160px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 20px;
            outline: none;
        }

        input[type="text"]:focus { border-color: var(--primary); }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, background 0.2s;
        }

        button:hover { background: #2563eb; transform: translateY(-1px); }
        button:active { transform: translateY(1px); }

        /* 有向數教學區域 */
        .tutorial-box {
            background: #172554;
            border: 2px solid #1d4ed8;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
        }

        .tutorial-header {
            color: #fca5a5;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* 數線樣式 */
        .number-line-container {
            margin: 30px 0 20px 0;
            padding: 10px;
            background: #0f172a;
            border-radius: 8px;
            overflow-x: auto;
        }

        .number-line {
            display: flex;
            justify-content: space-between;
            position: relative;
            height: 40px;
            padding: 0 10px;
        }

        .line-axis {
            position: absolute;
            top: 15px;
            left: 0;
            right: 0;
            height: 2px;
            background: #94a3b8;
        }

        .line-axis::before {
            content: '◀'; position: absolute; left: -2px; top: -7px; color: #94a3b8; font-size: 0.8rem;
        }
        .line-axis::after {
            content: '▶'; position: absolute; right: -2px; top: -7px; color: #94a3b8; font-size: 0.8rem;
        }

        .line-node {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.8rem;
            color: #64748b;
            z-index: 1;
            width: 24px;
        }

        .line-node::before {
            content: ''; width: 6px; height: 6px; background: #475569; border-radius: 50%; margin-top: 13px; margin-bottom: 5px;
        }

        /* 數線上的標記點 */
        .line-node.start-point { color: #f59e0b; font-weight: bold; }
        .line-node.start-point::before { background: #f59e0b; transform: scale(1.5); }
        
        .line-node.end-point { color: #10b981; font-weight: bold; }
        .line-node.end-point::before { background: #10b981; transform: scale(1.5); }

        .line-node.zero-point { color: #ef4444; }
        .line-node.zero-point::before { background: #ef4444; }
    </style>
</head>
<body>

    <div class="game-card">
        <!-- 主畫面 -->
        <div id="start-screen" class="screen active">
            <h1>🌐 有向數思維挑戰</h1>
            <p style="color: #94a3b8; line-height: 1.6;">挑戰正負數的加、減、乘、除！<br>請記得輸入負號「-」，所有答案皆為<b>整數</b>。</p>
            <button onclick="startGame()">開始挑戰</button>
        </div>

        <!-- 遊戲中畫面 -->
        <div id="game-screen" class="screen">
            <div class="hud">
                <span>得分: <span id="score" style="color:var(--success);">0</span></span>
                <span>等級: <span id="level" style="color:var(--primary);">1</span></span>
            </div>
            <div class="timer-bar-container">
                <div id="timer-bar" class="timer-bar"></div>
            </div>
            <div class="question" id="question-text">( -3 ) + ( +5 )</div>
            <input type="text" id="answer-input" placeholder="?" autocomplete="off" onkeyup="handleKeyUp(event)">
            <button onclick="submitAnswer()">送出答案</button>

            <!-- 答錯時的數線教學板 -->
            <div id="tutorial-area" style="display: none;">
                <div class="tutorial-box">
                    <div class="tutorial-header">💡 觀念解析：</div>
                    <p id="tutorial-desc" style="line-height: 1.5; font-size: 0.95rem; margin: 0;"></p>
                    
                    <!-- 數線視覺化 -->
                    <div class="number-line-container" id="number-line-section">
                        <div class="number-line" id="number-line-ui">
                            <div class="line-axis"></div>
                            <!-- 動態生成節點 -->
                        </div>
                    </div>
                    
                    <button style="background: var(--success); margin-top: 10px;" onclick="nextQuestion()">懂了，下一題！</button>
                </div>
            </div>
        </div>

        <!-- 遊戲結束畫面 -->
        <div id="game-over-screen" class="screen">
            <h1>🏆 挑戰結束！</h1>
            <p style="color: #94a3b8;">成功掌握有向數的正負邏輯！</p>
            <h2 style="font-size: 2rem; margin: 20px 0;">最終得分: <span id="final-score" style="color:var(--success);">0</span></h2>
            <button onclick="resetGame()">再玩一次</button>
        </div>
    </div>

    <script>
        let game = {
            score: 0,
            level: 1,
            num1: 0,
            num2: 0,
            op: '',
            ans: 0,
            timeLeft: 100,
            timerInterval: null,
            isFrozen: false
        };

        const SECONDS_PER_QUESTION = 20;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startGame() {
            game.score = 0;
            game.level = 1;
            showScreen('game-screen');
            generateNewQuestion();
        }

        // 格式化輸出有向數的文字表示，例如 (-5) 或 (+3)
        function fmt(num) {
            return num < 0 ? `( ${num} )` : `( +${num} )`;
        }

        function generateNewQuestion() {
            game.isFrozen = false;
            document.getElementById('answer-input').disabled = false;
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').focus();
            document.getElementById('tutorial-area').style.display = 'none';
            
            // 根據等級決定運算規則，保證答案為整數
            const ops = ['+', '-'];
            if (game.level >= 2) ops.push('*');
            if (game.level >= 3) ops.push('/');
            
            game.op = ops[Math.floor(Math.random() * ops.length)];
            
            let maxRange = game.level + 4; // 隨等級提高擴大數字範圍
            
            // 隨機生成包含正負的非零數
            let n1 = (Math.floor(Math.random() * maxRange) + 1) * (Math.random() < 0.5 ? 1 : -1);
            let n2 = (Math.floor(Math.random() * maxRange) + 1) * (Math.random() < 0.5 ? 1 : -1);

            if (game.op === '+') {
                game.num1 = n1; game.num2 = n2;
                game.ans = n1 + n2;
            } else if (game.op === '-') {
                game.num1 = n1; game.num2 = n2;
                game.ans = n1 - n2;
            } else if (game.op === '*') {
                game.num1 = n1; game.num2 = n2;
                game.ans = n1 * n2;
            } else if (game.op === '/') {
                // 為了確保除法答案必為整數：先生成商(n2)與除數(n1)，再相乘得到被除數(num1)
                let quotient = n2; 
                let divisor = n1;
                game.num1 = divisor * quotient;
                game.num2 = divisor;
                game.ans = quotient;
            }

            // 轉換顯示符號
            let opStr = game.op;
            if (game.op === '*') opStr = '×';
            if (game.op === '/') opStr = '÷';
