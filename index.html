<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌐 有向數挑戰 Directed Number Quest</title>
    <style>
        :root {
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }
        * { box-sizing: border-box; font-family: sans-serif; }
        body {
            background-color: var(--bg); color: var(--text);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }
        .game-card {
            background-color: var(--card); border: 2px solid #334155;
            border-radius: 20px; padding: 30px; width: 100%; max-width: 520px; text-align: center;
        }
        .screen { display: none; }
        .active { display: block; }
        h1 { color: #60a5fa; margin-bottom: 10px; }
        .hud {
            display: flex; justify-content: space-between; background: #0f172a;
            padding: 10px 15px; border-radius: 10px; margin-bottom: 20px;
        }
        .timer-bar-container { background: #334155; height: 6px; border-radius: 3px; margin-bottom: 25px; overflow: hidden; }
        .timer-bar { background: var(--warning); height: 100%; width: 100%; transition: width 0.1s linear; }
        .question { font-size: 3rem; font-weight: bold; margin: 20px 0; }
        input[type="text"] {
            background: #0f172a; color: white; border: 2px solid #475569;
            font-size: 1.8rem; padding: 12px; width: 160px; text-align: center; border-radius: 12px; margin-bottom: 20px; outline: none;
        }
        button {
            background: var(--primary); color: white; border: none; padding: 14px 28px;
            font-size: 1.1rem; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%;
        }
        .tutorial-box { background: #172554; border: 2px solid #1d4ed8; border-radius: 12px; padding: 20px; margin-top: 20px; text-align: left; }
        .number-line-container { margin: 20px 0; padding: 15px 10px; background: #0f172a; border-radius: 8px; overflow-x: auto; white-space: nowrap; }
        .number-line { position: relative; display: inline-block; padding: 10px 0; min-width: 100%; text-align: center; }
        .line-axis { position: absolute; top: 22px; left: 0; right: 0; height: 2px; background: #94a3b8; }
        .line-node {
            display: inline-block; width: 35px; text-align: center; position: relative; font-size: 0.8rem; color: #64748b; margin: 0 2px;
        }
        .line-node::before {
            content: ''; display: block; width: 6px; height: 6px; background: #475569; border-radius: 50%; margin: 5px auto;
        }
        .line-node.start-point { color: #f59e0b; font-weight: bold; }
        .line-node.start-point::before { background: #f59e0b; transform: scale(1.5); }
        .line-node.end-point { color: #10b981; font-weight: bold; }
        .line-node.end-point::before { background: #10b981; transform: scale(1.5); }
        .line-node.zero-point { color: #ef4444; font-weight: bold; }
        .line-node.zero-point::before { background: #ef4444; }
    </style>
</head>
<body>

    <div class="game-card">
        <!-- 主畫面 -->
        <div id="start-screen" class="screen active">
            <h1>🌐 有向數思維挑戰</h1>
            <p style="color: #94a3b8;">挑戰正負數的加減乘除！答案皆為<b>整數</b>。</p>
            <button onclick="startGame()">開始挑戰</button>
        </div>

        <!-- 遊戲中畫面 -->
        <div id="game-screen" class="screen">
            <div class="hud">
                <span>得分: <span id="score" style="color:var(--success);">0</span></span>
                <span>等級: <span id="level" style="color:var(--primary);">1</span></span>
            </div>
            <div class="timer-bar-container">
                <div id="timer-bar" class="timer-bar"></div>
            </div>
            <div class="question" id="question-text">( -3 ) + ( +5 )</div>
            <input type="text" id="answer-input" placeholder="?" autocomplete="off" onkeyup="handleKeyUp(event)">
            <button onclick="submitAnswer()">送出答案</button>

            <!-- 答錯教學板 -->
            <div id="tutorial-area" style="display: none;">
                <div class="tutorial-box">
                    <div style="color:#fca5a5; font-weight:bold; margin-bottom:10px;">💡 觀念解析：</div>
                    <p id="tutorial-desc" style="line-height: 1.5; font-size: 0.95rem; margin: 0;"></p>
                    
                    <div class="number-line-container" id="number-line-section">
                        <div class="number-line" id="number-line-ui">
                            <div class="line-axis"></div>
                        </div>
                    </div>
                    
                    <button style="background: var(--success); margin-top: 10px;" onclick="nextQuestion()">懂了，下一題！</button>
                </div>
            </div>
        </div>

        <!-- 遊戲結束畫面 -->
        <div id="game-over-screen" class="screen">
            <h1>🏆 挑戰結束！</h1>
            <h2 style="font-size: 2rem; margin: 20px 0;">最終得分: <span id="final-score" style="color:var(--success);">0</span></h2>
            <button onclick="resetGame()">再玩一次</button>
        </div>
    </div>
    <script>
        let game = {
            score: 0, level: 1, num1: 0, num2: 0, op: '', ans: 0,
            timeLeft: 100, timerInterval: null, isFrozen: false
        };

        const SECONDS_PER_QUESTION = 20;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const el = document.getElementById(id);
            if(el) el.classList.add('active');
        }

        function startGame() {
            game.score = 0;
            game.level = 1;
            document.getElementById('score').innerText = "0";
            document.getElementById('level').innerText = "1";
            showScreen('game-screen');
            generateNewQuestion();
        }

        function fmt(num) {
            return num < 0 ? `( ${num} )` : `( +${num} )`;
        }

        function generateNewQuestion() {
            game.isFrozen = false;
            document.getElementById('answer-input').disabled = false;
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').focus();
            document.getElementById('tutorial-area').style.display = 'none';
            
            const ops = ['+', '-'];
            if (game.level >= 2) ops.push('*');
            if (game.level >= 3) ops.push('/');
            
            game.op = ops[Math.floor(Math.random() * ops.length)];
            let maxRange = game.level + 4;
            
            let n1 = (Math.floor(Math.random() * maxRange) + 1) * (Math.random() < 0.5 ? 1 : -1);
            let n2 = (Math.floor(Math.random() * maxRange) + 1) * (Math.random() < 0.5 ? 1 : -1);

            if (game.op === '+') {
                game.num1 = n1; game.num2 = n2; game.ans = n1 + n2;
            } else if (game.op === '-') {
                game.num1 = n1; game.num2 = n2; game.ans = n1 - n2;
            } else if (game.op === '*') {
                game.num1 = n1; game.num2 = n2; game.ans = n1 * n2;
            } else if (game.op === '/') {
                // 保證除法為整數
                game.num1 = n1 * n2; game.num2 = n1; game.ans = n2;
            }

            let opStr = game.op;
            if (game.op === '*') opStr = '×';
            if (game.op === '/') opStr = '÷';

            document.getElementById('question-text').innerText = `${fmt(game.num1)} ${opStr} ${fmt(game.num2)}`;
            startTimer();
        }

        function startTimer() {
            clearInterval(game.timerInterval);
            game.timeLeft = 100;
            document.getElementById('timer-bar').style.width = '100%';
            document.getElementById('timer-bar').style.background = 'var(--warning)';

            game.timerInterval = setInterval(() => {
                if (game.isFrozen) return;
                game.timeLeft -= (100 / (SECONDS_PER_QUESTION * 10));
                document.getElementById('timer-bar').style.width = `${game.timeLeft}%`;

                if (game.timeLeft <= 30) {
                    document.getElementById('timer-bar').style.background = 'var(--danger)';
                }
                if (game.timeLeft <= 0) {
                    clearInterval(game.timerInterval);
                    triggerFailure();
                }
            }, 100);
        }

        function handleKeyUp(e) {
            if (e.key === 'Enter') submitAnswer();
        }

        function submitAnswer() {
            if (game.isFrozen) return;
            const val = document.getElementById('answer-input').value.trim();
            const userAns = parseInt(val);
            if (isNaN(userAns)) return;

            if (userAns === game.ans) {
                clearInterval(game.timerInterval);
                game.score += 10;
                game.level = Math.floor(game.score / 30) + 1;
                
                document.getElementById('score').innerText = game.score;
                document.getElementById('level').innerText = game.level;

                if (game.level > 5) endGame(); else generateNewQuestion();
            } else {
                clearInterval(game.timerInterval);
                triggerFailure();
            }
        }

        function triggerFailure() {
            game.isFrozen = true;
            document.getElementById('answer-input').disabled = true;

            let desc = '';
            let showLine = false;

            if (game.op === '+' || game.op === '-') {
                showLine = true;
                if (game.op === '+') {
                    desc = game.num2 > 0 ? `加正數等於「向右移」。從 <b>${game.num1}</b> 開始，向右移 <b>${game.num2}</b> 格，到達 <b>${game.ans}</b>。` : `加負數等於「減去正數（向左移）」。從 <b>${game.num1}</b> 開始，向左移 <b>${Math.abs(game.num2)}</b> 格，到達 <b>${game.ans}</b>。`;
                } else {
                    desc = game.num2 > 0 ? `減去正數等於「向左移」。從 <b>${game.num1}</b> 開始，向左移 <b>${game.num2}</b> 格，到達 <b>${game.ans}</b>。` : `負負得正！減去負數等於「加上正數（向右移）」。從 <b>${game.num1}</b> 開始，向右移 <b>${Math.abs(game.num2)}</b> 格，到達 <b>${game.ans}</b>。`;
                }
            } else {
                showLine = false;
                let ruleText = (game.num1 * game.num2 > 0) ? "「同號得正」" : "「異號得負」";
                desc = `乘除法規則：<b>${ruleText}</b>。<br>符號相同結果為正，不同則為負。正確答案是 <b>${game.ans}</b>。`;
            }

            document.getElementById('tutorial-desc').innerHTML = desc;

            const lineSection = document.getElementById('number-line-section');
            if (showLine) {
                lineSection.style.display = 'block';
                buildNumberLine(game.num1, game.ans);
            } else {
                lineSection.style.display = 'none';
            }

            document.getElementById('tutorial-area').style.display = 'block';
        }

        function buildNumberLine(start, end) {
            const ui = document.getElementById('number-line-ui');
            ui.querySelectorAll('.line-node').forEach(n => n.remove());

            let minVal = Math.min(start, end, 0) - 2;
            let maxVal = Math.max(start, end, 0) + 2;

            for (let i = minVal; i <= maxVal; i++) {
                const node = document.createElement('div');
                node.className = 'line-node';
                node.innerText = i;
                
                if (i === 0) node.classList.add('zero-point');
                if (i === start) node.classList.add('start-point');
                if (i === end) node.classList.add('end-point');

                ui.appendChild(node);
            }
        }

        function nextQuestion() { generateNewQuestion(); }
        function endGame() { clearInterval(game.timerInterval); showScreen('game-over-screen'); document.getElementById('final-score').innerText = game.score; }
        function resetGame() { startGame(); }
    </script>
</body>
</html>
